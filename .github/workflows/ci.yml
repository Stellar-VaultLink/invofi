name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  frontend-lint-and-typecheck:
    name: Frontend / Lint & Type Check
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: invofi/apps/frontend
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: invofi/apps/frontend/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run type-check

  frontend-build:
    name: Frontend / Build
    runs-on: ubuntu-latest
    needs: frontend-lint-and-typecheck
    defaults:
      run:
        working-directory: invofi/apps/frontend
    env:
      # Placeholder values — CI only needs the build to succeed, not to talk to
      # a real Supabase project or contract. Real secrets live in Vercel.
      NEXT_PUBLIC_SUPABASE_URL: https://placeholder.supabase.co
      NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: placeholder-anon-key
      # Live v0.3 contract on Stellar testnet — matches README's Live Demo section.
      NEXT_PUBLIC_REGISTRY_CONTRACT_ID: CAXNTWSKDVSB3GPJMU3RTSDTAIFF4A6FFRAAI35B4AE7LZLLI4VXMCF7
      NEXT_PUBLIC_FINANCING_CONTRACT_ID: CBGRA3457ZFXYZNEQLO4YGUQ3OBEWOE6US6ZREHK6NF2DLZYBO73IFVW
      NEXT_PUBLIC_REPAYMENT_CONTRACT_ID: CCDATW5GMVDOPK55Q4MLXV5SGA3VLXPD67ABLBNMHWFF6BLL2IZBUVEP
      NEXT_PUBLIC_STELLAR_NETWORK: testnet
      NEXT_PUBLIC_RPC_URL: https://soroban-testnet.stellar.org
      NEXT_PUBLIC_HORIZON_URL: https://horizon-testnet.stellar.org
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: invofi/apps/frontend/package-lock.json
      - run: npm ci
      - run: npm run build

  commitlint:
    name: Conventional Commits
    runs-on: ubuntu-latest
    # Gate to pull requests only. Direct maintainer pushes to main (e.g. GitHub
    # web-editor commits such as "Update README.md") are not Conventional Commits
    # and would otherwise fail every direct push. The gate still protects every
    # contributor PR, which is where it adds value.
    if: github.event_name == 'pull_request'
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: wagoid/commitlint-github-action@v6

  # Smart contract tests and WASM builds moved to Stellar-VaultLink/invofi-contracts
  # (Rust-only CI) as part of the two-repo topology migration.

name: Contributors

on:
  push:
    branches:
      - main
  schedule:
    # Weekly retry: GitHub's contributor-stats cache lags new merges by up to
    # a few days, so the push-triggered run right after a merge can miss a
    # contributor. This run re-syncs the table once the cache has caught up.
    # Wednesday 09:00 UTC — deliberately offset from the contracts Monday
    # token watchdog so the two scheduled jobs don't overlap.
    - cron: '0 9 * * 3'
  workflow_dispatch:

# Serialize runs: the bot rewrites the same README section (via a PR on this
# protected branch), so a scheduled run and a push-triggered run must never
# race each other.
concurrency:
  group: contributors-readme
  cancel-in-progress: false

permissions:
  contents: write
  pull-requests: write

jobs:
  contrib-readme-job:
    runs-on: ubuntu-latest
    name: A job to automate contrib in readme
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Contribute List
        uses: akhilmhdh/contributors-readme-action@83ea0b4f1ac928fbfe88b9e8460a932a528eb79f # v2.3.11
        env:
          GITHUB_TOKEN: ${{ secrets.CONTRIBUTORS_TOKEN }}
        with:
          image_size: 100
          columns_per_row: 6
          readme_path: README.md
          commit_message: 'docs(contributor): update contributors list'
          pr_title_on_protected: 'docs(contributor): update contributors list'

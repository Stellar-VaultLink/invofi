name: invoice-reminders

# InvoFi automated invoice reminder system (Closes #224).
#
# Runs once a day to:
#   1. Read the `reminder_configs` singleton row (admin on/off + stage list).
#   2. Query Financed/Overdue invoices and compute which ones match a
#      schedule stage today (7/1 days before due, on due date, 1/7 days
#      after) — skipping opted-out invoices and stages already sent.
#   3. Email the originator via Resend and, if configured, POST a signed
#      webhook payload with retry.
#   4. Log every attempt to Supabase `invoice_reminders`.
#
# The /invoices/[id] page shows per-invoice history + an opt-out toggle;
# /dashboard/reminders (admin-only) shows settings + cross-invoice activity.
#
# Required repo configuration (once):
#   Secrets:
#     SUPABASE_URL               — your Supabase project URL
#     SUPABASE_SERVICE_ROLE_KEY  — service role key (bypasses RLS for writes)
#     RESEND_API_KEY             — Resend transactional email API key
#   Variables (optional):
#     REMINDER_FROM_EMAIL        — default: reminders@invofi.app
#
# Enable/disable on demand:
#   gh workflow enable  invoice-reminders.yml -R Stellar-VaultLink/invofi
#   gh workflow disable invoice-reminders.yml -R Stellar-VaultLink/invofi

on:
  schedule:
    # Once a day at 09:00 UTC — after the keeper (:00) and health collector
    # (:45) so overdue status transitions have already landed.
    - cron: '0 9 * * *'
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Compute and log but do not send emails/webhooks or write to Supabase'
        type: boolean
        required: false
        default: false

permissions:
  contents: read

jobs:
  remind:
    name: Invoice reminders / daily
    runs-on: ubuntu-latest
    # Three workspace installs (scripts/frontend/sdk) + type-check + tests.
    # npm cache (below) keeps installs fast; the cap is generous for the
    # first cold run after a lockfile change.
    timeout-minutes: 30

    defaults:
      run:
        working-directory: invofi/scripts

    steps:
      # ── Checkout ──────────────────────────────────────────────────────────
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v4

      # ── Node.js ───────────────────────────────────────────────────────────
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v4
        with:
          node-version: 22

      # Monorepo npm cache: scripts, frontend, and sdk each have their own
      # lockfile, so key the shared ~/.npm cache on all of them — caching on
      # one lockfile only would miss the other two workspaces and every run
      # would re-download the full frontend dependency tree.
      - name: Cache npm dependencies
        uses: actions/cache@5a3ec84eff668545956fd18022155c47e93e2684 # v4.2.3
        with:
          path: ~/.npm
          key: npm-${{ runner.os }}-${{ hashFiles('**/package-lock.json') }}
          restore-keys: |
            npm-${{ runner.os }}-

      # ── Install dependencies ──────────────────────────────────────────────
      - name: Install dependencies
        run: npm ci

      # The type-check imports from ../apps/frontend and ../apps/sdk,
      # which require their own workspace dependencies (stellar-sdk, etc.).
      - name: Install frontend dependencies (for type-check)
        run: npm ci
        working-directory: invofi/apps/frontend
      - name: Install SDK dependencies (for type-check)
        run: npm ci
        working-directory: invofi/apps/sdk

      # ── Type-check ────────────────────────────────────────────────────────
      - name: Type-check
        run: npm run type-check

      # ── Run unit tests ────────────────────────────────────────────────────
      # Invoked directly via tsx (not an npm script) so this workflow doesn't
      # require touching package.json — keeps it out of the path filter for
      # the "Verify package-lock.json is in sync" check.
      - name: Run unit tests
        run: npx tsx --test invoice-reminders.test.ts

      # ── Run collector ─────────────────────────────────────────────────────
      # Supabase is mid-migration (see README); until SUPABASE_URL and
      # SUPABASE_SERVICE_ROLE_KEY are configured in repo secrets, the daily run
      # validates type-check + unit tests above and skips the send (same
      # graceful-skip pattern as health-collector). Re-enable by adding the
      # secrets.
      - name: Send due-date reminders
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          REMINDER_FROM_EMAIL: ${{ vars.REMINDER_FROM_EMAIL || 'reminders@invofi.app' }}
          DRY_RUN: ${{ github.event.inputs.dry_run || 'false' }}
        run: |
          if [ -z "$SUPABASE_URL" ] || [ -z "$SUPABASE_SERVICE_ROLE_KEY" ]; then
            echo "[invoice-reminders] SUPABASE_URL / SUPABASE_SERVICE_ROLE_KEY not configured — skipping send (Supabase migration paused)."
            exit 0
          fi
          npx tsx invoice-reminders.ts

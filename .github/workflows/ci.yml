name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  frontend-lint-and-typecheck:
    name: Frontend / Lint & Type Check
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: invofi/apps/frontend
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: invofi/apps/frontend/package-lock.json
      - run: npm ci --legacy-peer-deps
      - run: npm run lint
      - run: npm run type-check
      - run: node ../../../scripts/check-sdk-parity.js

  frontend-test:
    name: Frontend / Unit Tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: invofi/apps/frontend
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: invofi/apps/frontend/package-lock.json
      - run: npm ci --legacy-peer-deps
      - run: npm test

  frontend-build:
    name: Frontend / Build
    runs-on: ubuntu-latest
    needs: frontend-lint-and-typecheck
    defaults:
      run:
        working-directory: invofi/apps/frontend
    env:
      # Placeholder values — CI only needs the build to succeed, not to talk to
      # a real Supabase project or contract. Real secrets live in Vercel.
      NEXT_PUBLIC_SUPABASE_URL: https://placeholder.supabase.co
      NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: placeholder-anon-key
      # Live v0.3 contract on Stellar testnet — matches README's Live Demo section.
      NEXT_PUBLIC_REGISTRY_CONTRACT_ID: CCV4OSLYRRMYTRMWH4GVWY2QGSFC5PV33KYQEMQF6DOQW3OXDAVBSHSY
      NEXT_PUBLIC_FINANCING_CONTRACT_ID: CAVZID42BNQAJTK75XSO3RP5SR4K5PNHCSSBGDSTBBW7E2BSMKZOVALL
      NEXT_PUBLIC_REPAYMENT_CONTRACT_ID: CBAJWUCH2JDX7EPARWDDSGZDJ5PST7TBTXKGIIKLZ45MD2BYQX6EHQGF
      NEXT_PUBLIC_STELLAR_NETWORK: testnet
      NEXT_PUBLIC_RPC_URL: https://soroban-testnet.stellar.org
      NEXT_PUBLIC_HORIZON_URL: https://horizon-testnet.stellar.org
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: invofi/apps/frontend/package-lock.json
      - run: npm ci --legacy-peer-deps
      - run: npm run build

  frontend-bundle-and-smoke:
    name: Frontend / Bundle Budget & Route Smoke
    runs-on: ubuntu-latest
    needs: frontend-build
    defaults:
      run:
        working-directory: invofi/apps/frontend
    env:
      NEXT_PUBLIC_SUPABASE_URL: https://placeholder.supabase.co
      NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: placeholder-anon-key
      NEXT_PUBLIC_REGISTRY_CONTRACT_ID: CCV4OSLYRRMYTRMWH4GVWY2QGSFC5PV33KYQEMQF6DOQW3OXDAVBSHSY
      NEXT_PUBLIC_FINANCING_CONTRACT_ID: CAVZID42BNQAJTK75XSO3RP5SR4K5PNHCSSBGDSTBBW7E2BSMKZOVALL
      NEXT_PUBLIC_REPAYMENT_CONTRACT_ID: CBAJWUCH2JDX7EPARWDDSGZDJ5PST7TBTXKGIIKLZ45MD2BYQX6EHQGF
      NEXT_PUBLIC_STELLAR_NETWORK: testnet
      NEXT_PUBLIC_RPC_URL: https://soroban-testnet.stellar.org
      NEXT_PUBLIC_HORIZON_URL: https://horizon-testnet.stellar.org
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          # The workflow only reads the repository; do not leave the GitHub
          # token in the runner's git config for the npm ci / build steps.
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: invofi/apps/frontend/package-lock.json
      - run: npm ci --legacy-peer-deps
      # Rebuild so the budget check compares against a fresh per-route table.
      - run: npm run build 2>&1 | tee next-build.log
      - name: Bundle size budget
        run: node ../../../scripts/check-bundle-budget.mjs --log next-build.log
      - name: Route smoke check
        run: node ../../../scripts/route-smoke-check.mjs --port 3100 < next-build.log

  commitlint:
    name: Conventional Commits
    runs-on: ubuntu-latest
    # Gate to pull requests only. Direct maintainer pushes to main (e.g. GitHub
    # web-editor commits such as "Update README.md") are not Conventional Commits
    # and would otherwise fail every direct push. The gate still protects every
    # contributor PR, which is where it adds value.
    if: github.event_name == 'pull_request'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
      - uses: wagoid/commitlint-github-action@b948419dd99f3fd78a6548d48f94e3df7f6bf3ed # v6

  frontend-a11y:
    name: Frontend / A11y Scan (axe-core)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: invofi/apps/frontend
    env:
      NEXT_PUBLIC_SUPABASE_URL: https://placeholder.supabase.co
      NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: placeholder-anon-key
      NEXT_PUBLIC_REGISTRY_CONTRACT_ID: CCV4OSLYRRMYTRMWH4GVWY2QGSFC5PV33KYQEMQF6DOQW3OXDAVBSHSY
      NEXT_PUBLIC_FINANCING_CONTRACT_ID: CAVZID42BNQAJTK75XSO3RP5SR4K5PNHCSSBGDSTBBW7E2BSMKZOVALL
      NEXT_PUBLIC_REPAYMENT_CONTRACT_ID: CBAJWUCH2JDX7EPARWDDSGZDJ5PST7TBTXKGIIKLZ45MD2BYQX6EHQGF
      NEXT_PUBLIC_STELLAR_NETWORK: testnet
      NEXT_PUBLIC_RPC_URL: https://soroban-testnet.stellar.org
      NEXT_PUBLIC_HORIZON_URL: https://horizon-testnet.stellar.org
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: invofi/apps/frontend/package-lock.json
      - run: npm ci --legacy-peer-deps
      - name: Install Playwright Chromium + system deps
        run: npx playwright install --with-deps chromium
      - name: Run axe-core accessibility scan
        run: npm run test:a11y
      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: a11y-playwright-report
          path: invofi/apps/frontend/playwright-report
          retention-days: 14

  # The wallet-connection contract (ADR-0011) is user-facing and easy to
  # regress silently — run its spec on every PR instead of waiting for the
  # weekly e2e.yml sweep. Scoped to wallet-connection + wallet-dialog so the
  # job stays under CI's free-tier runtime budget; the full suite runs weekly
  # (e2e.yml). Same env contract as playwright.config.ts's webServer block.
  frontend-wallet-e2e:
    name: Frontend / Wallet E2E (Playwright)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: invofi/apps/frontend
    env:
      NEXT_PUBLIC_SUPABASE_URL: https://e2e.supabase.co
      NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: placeholder-publishable-key
      NEXT_PUBLIC_REGISTRY_CONTRACT_ID: CCV4OSLYRRMYTRMWH4GVWY2QGSFC5PV33KYQEMQF6DOQW3OXDAVBSHSY
      NEXT_PUBLIC_FINANCING_CONTRACT_ID: CAVZID42BNQAJTK75XSO3RP5SR4K5PNHCSSBGDSTBBW7E2BSMKZOVALL
      NEXT_PUBLIC_REPAYMENT_CONTRACT_ID: CBAJWUCH2JDX7EPARWDDSGZDJ5PST7TBTXKGIIKLZ45MD2BYQX6EHQGF
      NEXT_PUBLIC_STELLAR_NETWORK: testnet
      NEXT_PUBLIC_RPC_URL: https://soroban-testnet.stellar.org
      NEXT_PUBLIC_HORIZON_URL: https://horizon-testnet.stellar.org
      NEXT_PUBLIC_TRUSTLESS_WORK_API_KEY: e2e-flag
      NEXT_PUBLIC_TRUSTLESS_WORK_ENV: testnet
      NEXT_PUBLIC_TRUSTLESS_WORK_PLATFORM_ADDRESS: GARQM6JYPWTTOEQRRLL5L3N5I3TOPOVWR4G72H6E5NVMNB5RK662UXVR
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: invofi/apps/frontend/package-lock.json
      - run: npm ci --legacy-peer-deps
      - name: Install Playwright Chromium + system deps
        run: npx playwright install --with-deps chromium
      - name: Run wallet e2e specs
        run: npx playwright test e2e/wallet-connection.spec.ts e2e/wallet-dialog.spec.ts
      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: wallet-e2e-playwright-report
          path: invofi/apps/frontend/playwright-report
          retention-days: 14

  # Smart contract tests and WASM builds moved to Stellar-VaultLink/invofi-contracts
  # (Rust-only CI) as part of the two-repo topology migration.
